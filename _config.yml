# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole site, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing these this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.github_repo }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Linh-Co Bui
description: "MSR student at the Carnegie Mellon Robotics Institute. Robot safety, uncertainty modelling and memory."

# Links shown in the right-hand column of the homepage.
profile_links:
  - name: LinkedIn
    url: "https://www.linkedin.com/in/linh-co-bui/"
  - name: Google Scholar
    url: "https://scholar.google.com/citations?user=v8mCs-sAAAAJ&hl=en&oi=ao"

# Set to false to drop the "Website in progress" note from the homepage.
wip: true

baseurl: "" # the subpath of your site, e.g. /blog
url: "https://linhcobui.github.io" # the base hostname & protocol for your site
github_repo: linhcobui.github.io # the GitHub repo name for your project
github_username: linhcobui

# Set theme color here
# Choose from: black (default), blue, gray, magenta, orange, red, white, and yellow.
theme_color: black

# Build settings
markdown: kramdown
